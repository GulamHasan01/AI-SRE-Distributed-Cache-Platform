<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${subject}">Email</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #080910; font-family: 'Helvetica Neue', Arial, sans-serif; color: #e8eaf0; }
    .wrapper { max-width: 560px; margin: 40px auto; padding: 0 20px 40px; }
    .header  { text-align: center; padding: 32px 0 24px; border-bottom: 1px solid #1e2130; margin-bottom: 32px; }
    .logo    { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-mark { width: 36px; height: 36px; background: #6c63ff; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; color: white; }
    .logo-text { font-size: 18px; font-weight: 800; color: #e8eaf0; letter-spacing: -0.02em; }
    .card    { background: #0d0f14; border: 1px solid #1e2130; border-radius: 12px; padding: 32px; }
    h1       { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 12px; color: #e8eaf0; }
    p        { font-size: 15px; line-height: 1.7; color: #8b90a8; margin-bottom: 16px; }
    .btn     { display: inline-block; padding: 14px 28px; background: #6c63ff; color: white !important; text-decoration: none; border-radius: 8px; font-weight: 700; font-size: 15px; margin: 8px 0; }
    .btn:hover { background: #8b84ff; }
    .divider { height: 1px; background: #1e2130; margin: 24px 0; }
    .small   { font-size: 12px; color: #555870; line-height: 1.6; }
    .code-block { background: #13151c; border: 1px solid #2a2d3e; border-radius: 8px; padding: 16px 20px; font-family: 'Courier New', monospace; font-size: 13px; color: #8b84ff; word-break: break-all; margin: 16px 0; }
    .footer  { text-align: center; margin-top: 32px; }
    .highlight { color: #6c63ff; font-weight: 600; }
    .warning { background: rgba(249,115,22,0.08); border: 1px solid rgba(249,115,22,0.2); border-radius: 8px; padding: 14px 16px; color: #f97316; font-size: 13px; margin: 16px 0; }
    .success { background: #052010; border: 1px solid rgba(34,197,94,0.2); border-radius: 8px; padding: 14px 16px; color: #22c55e; font-size: 13px; margin: 16px 0; }
    .danger  { background: #1a0505; border: 1px solid rgba(239,68,68,0.2); border-radius: 8px; padding: 14px 16px; color: #ef4444; font-size: 13px; margin: 16px 0; }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <a class="logo" th:href="${frontendUrl}">
      <span class="logo-mark">C</span>
      <span class="logo-text" th:text="${platformName}">Community</span>
    </a>
  </div>
  <div class="card">
    <!-- Content injected by each template -->
    <div th:replace="~{this :: content}"></div>
  </div>
  <div class="footer">
    <p class="small">
      You're receiving this email because you have an account on
      <span th:text="${platformName}">Community Platform</span>.<br/>
      If you didn't request this, you can safely ignore this email.<br/><br/>
      <a th:href="${frontendUrl}" style="color:#555870;">Unsubscribe</a> ·
      <a th:href="${frontendUrl + '/settings'}" style="color:#555870;">Notification Settings</a>
    </p>
  </div>
</div>
</body>
</html>
