<!-- password-changed.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/base :: layout(~{::content})}">
<body><th:block th:fragment="content">
  <h1>Your password was changed</h1>
  <p>Hi <span class="highlight" th:text="${username != null ? username : 'there'}">there</span>,</p>
  <p>Your password was successfully changed on <strong th:text="${changedAt}">just now</strong>.</p>
  <p>All active sessions have been revoked. Please log in again with your new password.</p>
  <a class="btn" th:href="${frontendUrl + '/login'}">Sign In →</a>
  <div class="divider"></div>
  <div class="danger">
    If you did NOT change your password, your account may be compromised.
    <a th:href="${frontendUrl + '/forgot-password'}" style="color:#ef4444;">Reset it immediately</a>
  </div>
</th:block></body>
</html>
