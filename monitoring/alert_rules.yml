groups:

  # ============================================================
  # Cache Node Availability
  # ============================================================
  - name: cache_node_availability
    rules:

      - alert: CacheNodeDown
        expr: up{job=~"cache-node-.*"} == 0
        for: 15s
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Cache node {{ $labels.node_id }} is DOWN"
          description: "Prometheus cannot scrape {{ $labels.instance }}. Node has been unreachable for > 15s."
          action: "Investigate immediately. AI SRE agent will begin OODA loop."

      - alert: CacheNodeHeartbeatMissed
        expr: |
          (time() - cache_node_last_heartbeat_seconds{job=~"cache-node-.*"}) > 15
        for: 10s
        labels:
          severity: warning
          category: availability
        annotations:
          summary: "Heartbeat missed on {{ $labels.node_id }}"
          description: "No heartbeat received from {{ $labels.node_id }} for {{ $value | humanizeDuration }}."

  # ============================================================
  # JVM Health
  # ============================================================
  - name: jvm_health
    rules:

      - alert: JvmHeapUsageCritical
        expr: |
          (
            jvm_memory_used_bytes{area="heap", job=~"cache-node-.*"}
            /
            jvm_memory_max_bytes{area="heap", job=~"cache-node-.*"}
          ) > 0.90
        for: 30s
        labels:
          severity: critical
          category: jvm
        annotations:
          summary: "JVM heap critical on {{ $labels.node_id }}"
          description: "JVM heap usage is {{ $value | humanizePercentage }} on {{ $labels.instance }}. OOM imminent."
          action: "Drain traffic and restart node."

      - alert: JvmHeapUsageHigh
        expr: |
          (
            jvm_memory_used_bytes{area="heap", job=~"cache-node-.*"}
            /
            jvm_memory_max_bytes{area="heap", job=~"cache-node-.*"}
          ) > 0.75
        for: 60s
        labels:
          severity: warning
          category: jvm
        annotations:
          summary: "JVM heap high on {{ $labels.node_id }}"
          description: "JVM heap usage is {{ $value | humanizePercentage }} on {{ $labels.instance }}."

      - alert: JvmGcPauseHigh
        expr: |
          rate(jvm_gc_pause_seconds_sum{job=~"cache-node-.*"}[5m])
          /
          rate(jvm_gc_pause_seconds_count{job=~"cache-node-.*"}[5m]) > 0.5
        for: 2m
        labels:
          severity: warning
          category: jvm
        annotations:
          summary: "High GC pause time on {{ $labels.node_id }}"
          description: "Average GC pause is {{ $value | humanizeDuration }} on {{ $labels.instance }}."

  # ============================================================
  # HTTP Error Rate
  # ============================================================
  - name: http_errors
    rules:

      - alert: Http5xxRateHigh
        expr: |
          rate(http_server_requests_seconds_count{status=~"5..", job=~"cache-node-.*"}[5m]) > 0.1
        for: 1m
        labels:
          severity: warning
          category: http
        annotations:
          summary: "High HTTP 5xx rate on {{ $labels.node_id }}"
          description: "5xx error rate is {{ $value | humanize }}/s on {{ $labels.instance }}."

      - alert: HttpLatencyHigh
        expr: |
          histogram_quantile(0.99,
            rate(http_server_requests_seconds_bucket{job=~"cache-node-.*"}[5m])
          ) > 2.0
        for: 2m
        labels:
          severity: warning
          category: http
        annotations:
          summary: "High p99 latency on {{ $labels.node_id }}"
          description: "p99 latency is {{ $value | humanizeDuration }} on {{ $labels.instance }}."

  # ============================================================
  # Cache Performance
  # ============================================================
  - name: cache_performance
    rules:

      - alert: CacheHitRatioLow
        expr: |
          (
            rate(cache_hits_total{job=~"cache-node-.*"}[5m])
            /
            (rate(cache_hits_total{job=~"cache-node-.*"}[5m]) + rate(cache_misses_total{job=~"cache-node-.*"}[5m]))
          ) < 0.50
        for: 3m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Low cache hit ratio on {{ $labels.node }}"
          description: "Cache hit ratio is {{ $value | humanizePercentage }} on {{ $labels.node }}."

      - alert: CacheEvictionRateHigh
        expr: rate(cache_evictions_total{job=~"cache-node-.*"}[2m]) > 50
        for: 1m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High eviction rate on {{ $labels.node }}"
          description: "Eviction rate is {{ $value | humanize }}/s on {{ $labels.node }}. Cache may be undersized."

      - alert: CacheSizeCritical
        expr: cache_size{job=~"cache-node-.*"} > 9000
        for: 30s
        labels:
          severity: warning
          category: capacity
        annotations:
          summary: "Cache near capacity on {{ $labels.node }}"
          description: "Cache size is {{ $value }} entries (max=10000) on {{ $labels.node }}."
