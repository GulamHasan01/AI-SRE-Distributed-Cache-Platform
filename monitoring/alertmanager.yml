global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'service', 'severity']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h
  receiver: 'sre-agent-webhook'

  routes:
    - match:
        severity: critical
      receiver: 'sre-agent-webhook'
      group_wait: 5s
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: 'notification-service'
      group_wait: 30s
      repeat_interval: 6h

receivers:
  - name: 'sre-agent-webhook'
    webhook_configs:
      - url: 'http://sre-agent:8000/webhook/alert'
        send_resolved: true
        http_config:
          follow_redirects: true

  - name: 'notification-service'
    webhook_configs:
      - url: 'http://notification-service:8088/api/v1/notifications/alerts'
        send_resolved: true
